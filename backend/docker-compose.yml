version: "3.8"

services:
  # --- VECTOR DATABASE ---
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.24.1
    container_name: weaviate_db
    ports:
      - "8080:8080"
      - "50051:50051" # gRPC port for high-performance vector search
    restart: on-failure:5
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none" # Set to 'none' if you provide your own embeddings, or add model providers (e.g., OpenAI, Ollama)
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate

  # --- RELATIONAL DATABASE ---
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: my_application_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: user_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql

  # --- GRAPH DATABASE ---
  neo4j:
    image: neo4j:5.18
    container_name: neo4j_db
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt protocol for application connections
    restart: always
    environment:
      NEO4J_AUTH: neo4j/neo4j_password_change_me
      NEO4J_PLUGINS: '["apoc"]' # Automatically installs the popular APOC plugin toolkit
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  weaviate_data:
  mysql_data:
  neo4j_data:
  neo4j_logs:

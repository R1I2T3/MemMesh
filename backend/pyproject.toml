[project]
name = "backend"
version = "0.1.0"
description = "MemMesh Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "pymysql",
    "aiomysql",
    "cryptography",
    "pydantic-settings",
    "bcrypt",
    "python-jose[cryptography]",
    "python-multipart",
    "alembic",
    "celery",
    "redis",
    "slowapi>=0.1.9",
    "weaviate-client",
    "neo4j",
    "langgraph",
    "langchain-core",
    "langchain-community",
    "langchain-google-genai",
    "langchain-docling",
    "deepeval",
    "docling",
    "arize-phoenix",
    "openinference-instrumentation-langchain",
    "email-validator",
    "ddgs>=9.14.4",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false


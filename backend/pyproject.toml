[project]
name = "backend"
version = "0.1.0"
description = "MemMesh Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "cryptography>=42.0.5",
    "pydantic-settings>=2.2.1",
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "weaviate-client>=4.5.4",
    "neo4j>=5.18.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-community>=0.0.27",
    "langchain-google-genai>=1.0.1",
    "guardrails-ai>=0.4.0",
    "deepeval>=0.21.0",
    "docling>=2.0.0",
    "arize-phoenix>=3.20.0",
    "openinference-instrumentation-langchain>=0.1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
